name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: oregano
          POSTGRES_PASSWORD: oregano
          POSTGRES_DB: oregano
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U oregano -d oregano"
          --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgres://oregano:oregano@localhost:5432/oregano
      TEST_DATABASE_URL: postgres://oregano:oregano@localhost:5432/oregano_test
      REDIS_URL: redis://localhost:6379
      CI: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `services` cannot pass a container command, and SeaweedFS needs one, so it is started here.
      - name: Start object storage (SeaweedFS, S3 on port 9000)
        run: |
          docker run -d --name s3 -p 9000:9000 \
            -v "$PWD/infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro" \
            chrislusf/seaweedfs:4.54 \
            server -dir=/data -s3 -s3.port=9000 -s3.config=/etc/seaweedfs/s3.json -ip.bind=0.0.0.0
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:9000/ || true)
            if [ "$code" = "403" ] || [ "$code" = "200" ]; then exit 0; fi
            sleep 2
          done
          docker logs s3
          exit 1
      - name: Create the test databases
        run: |
          PGPASSWORD=oregano psql -h localhost -U oregano -d oregano -c 'CREATE DATABASE oregano_test OWNER oregano;'
          PGPASSWORD=oregano psql -h localhost -U oregano -d oregano -c 'CREATE DATABASE oregano_e2e_test OWNER oregano;'
      - run: pnpm --filter @oregano/e2e exec playwright install --with-deps chromium
      - run: pnpm db:migrate
      - run: pnpm verify

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: pnpm audit --audit-level high
