name: oregano

services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: oregano
      POSTGRES_PASSWORD: oregano
      POSTGRES_DB: oregano
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oregano -d oregano"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # S3-compatible private storage for identity documents. MinIO's community image is no longer
  # published, so this is SeaweedFS (Apache 2.0, actively released).
  s3:
    image: chrislusf/seaweedfs:4.54
    command: server -dir=/data -s3 -s3.port=9000 -s3.config=/etc/seaweedfs/s3.json -ip.bind=0.0.0.0
    ports:
      - "9000:9000"
    volumes:
      - s3-data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

volumes:
  postgres-data:
  redis-data:
  s3-data:
